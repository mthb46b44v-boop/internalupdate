name: Auto Update XML

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update update.xml Automatically
        run: |
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          URL="https://github.com/mthb46b44v-boop/internalupdate/releases/download/${{ github.event.release.tag_name }}/YxN_UPDATED_INTERNAL_HERE.exe"
          
          curl -sL "$URL" -o temp.exe
          SIZE=$(stat -c%s temp.exe)
          rm temp.exe
          
          echo '<item>' > update.xml
          echo "  <version>$VERSION</version>" >> update.xml
          echo "  <size>$SIZE</size>" >> update.xml
          echo "  <url>$URL</url>" >> update.xml
          echo '</item>' >> update.xml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Auto-Updated version to $VERSION with size $SIZE" || exit 0
          git push
