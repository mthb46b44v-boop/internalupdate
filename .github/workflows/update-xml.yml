name: Auto Update XML

on:
  release:
    types: [published]
  workflow_dispatch: # Taaki tum manually bhi chala sako

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update update.xml Automatically
        run: |
          # 1. version.txt se version padho
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt | tr -d '\r\n')
          else
            VERSION="1.0.2" # Fallback
          fi
          
          # 2. Link banao (Tag ke bina, kyunki tumhara tag 1.0.2 hai)
          URL="https://github.com/mthb46b44v-boop/internalupdate/releases/download/$VERSION/YxN_UPDATED_INTERNAL_HERE.exe"
          
          # 3. Size nikaalo
          curl -sL "$URL" -o temp.exe
          SIZE=$(stat -c%s temp.exe)
          rm temp.exe
          
          # 4. XML likho
          echo '<item>' > update.xml
          echo "  <version>$VERSION</version>" >> update.xml
          echo "  <size>$SIZE</size>" >> update.xml
          echo "  <url>$URL</url>" >> update.xml
          echo '</item>' >> update.xml
          
          # 5. Commit and Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Auto-Updated to $VERSION with size $SIZE" || exit 0
          git push
