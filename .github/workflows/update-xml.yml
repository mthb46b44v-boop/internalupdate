name: Auto Update XML

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update update.xml Automatically
        run: |
          # 1. Tag se version nikaalo (jaise v1.0.2 se 1.0.2)
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          TAG="${{ github.event.release.tag_name }}"
          
          # 2. Link banao
          URL="https://github.com/mthb46b44v-boop/internalupdate/releases/download/$TAG/YxN_UPDATED_INTERNAL_HERE.exe"
          
          # 3. File ka Size nikaalo (Bytes me)
          curl -sL "$URL" -o temp.exe
          SIZE=$(stat -c%s temp.exe)
          rm temp.exe
          
          # 4. XML file likho
          echo '<item>' > update.xml
          echo "  <version>$VERSION</version>" >> update.xml
          echo "  <size>$SIZE</size>" >> update.xml
          echo "  <url>$URL</url>" >> update.xml
          echo '</item>' >> update.xml
          
          # 5. Commit and Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Auto-Updated to $VERSION with size $SIZE" || exit 0
          git push
