name: Auto Update XML

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update update.xml Automatically
        run: |
          # 1. Tag se version nikaalo (jaise v1.0.2 se 1.0.2)
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          
          # 2. EXE ka direct download link banao
          URL="https://github.com/mthb46b44v-boop/internalupdate/releases/download/${{ github.event.release.tag_name }}/YxN_UPDATED_INTERNAL_HERE.exe"
          
          # 3. Nayi XML file likho
          echo '<item>' > update.xml
          echo "  <version>$VERSION</version>" >> update.xml
          echo "  <url>$URL</url>" >> update.xml
          echo '</item>' >> update.xml
          
          # 4. Check karo ki file change hui ya nahi
          if git diff --quiet update.xml; then
            echo "Koi change nahi hua."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add update.xml
            git commit -m "Auto-Updated version to $VERSION"
            git push
          fi
