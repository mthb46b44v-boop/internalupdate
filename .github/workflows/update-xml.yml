name: Auto Update XML from version.txt

on:
  push:
    paths:
      - 'version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update update.xml from version.txt
        run: |
          # 1. version.txt se naya version padho
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt | tr -d '\r\n')
          else
            VERSION="1.0.2"
          fi
          
          # 2. Link banao (jo tumhare XML me hai waisa hi)
          URL="https://github.com/mthb46b44v-boop/internalupdate/releases/download/$VERSION/YxN_UPDATED_INTERNAL_HERE.exe"
          
          # 3. File ka Size nikaalo (Bytes me)
          curl -sL "$URL" -o temp.exe
          SIZE=$(stat -c%s temp.exe)
          rm temp.exe
          
          # 4. XML file update karo
          echo '<item>' > update.xml
          echo "  <version>$VERSION</version>" >> update.xml
          echo "  <size>$SIZE</size>" >> update.xml
          echo "  <url>$URL</url>" >> update.xml
          echo '</item>' >> update.xml
          
          # 5. Commit and Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Auto-Updated XML to version $VERSION with size $SIZE" || exit 0
          git push
